<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>증권사리포트 검색</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 14px; background: transparent; color: #2b2b2b; }
  .searchbox { display: flex; gap: 8px; }
  #q { flex: 1; font-size: 16px; padding: 10px 14px; border: 1.5px solid #b9c0c8; border-radius: 10px; outline: none; }
  #q:focus { border-color: #4a7dbd; }
  #stat { margin: 10px 2px; font-size: 13px; color: #667; }
  .row { display: flex; align-items: center; gap: 8px; padding: 9px 6px; border-bottom: 1px solid #e6e9ed; text-decoration: none; color: inherit; }
  .row:hover { background: #f2f6fa; }
  .d { font-size: 12px; color: #778; white-space: nowrap; }
  .c { font-size: 14.5px; font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .b { font-size: 12px; color: #567; white-space: nowrap; }
  .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .tag.web { background: #dbeafe; color: #1d4ed8; }
  .tag.tg { background: #e5e7eb; color: #4b5563; }
  #hint { color: #889; font-size: 13.5px; margin-top: 18px; line-height: 1.7; }
  @media (prefers-color-scheme: dark) {
    body { color: #d7d7d7; }
    #q { background: #1e1e22; color: #ddd; border-color: #444; }
    .row { border-color: #333; }
    .row:hover { background: #26262b; }
    .tag.tg { background: #333; color: #aaa; }
    .tag.web { background: #1e3a5f; color: #93c5fd; }
    #hint, #stat { color: #999; }
  }
</style>
</head>
<body>
<div class="searchbox"><input id="q" type="search" placeholder="회사명 또는 종목코드 검색 (예: 삼성전자, 005930)" autocomplete="off"></div>
<div id="stat"></div>
<div id="list"></div>
<div id="hint">회사명(또는 6자리 종목코드)을 입력하면 해당 종목의 증권사 리포트 원문을 찾아줍니다.<br>
🔵 <b>PDF</b> 표시는 웹에서 바로 열리고(최근 게시분), <b>텔레그램</b> 표시는 텔레그램 앱의 원본 메시지로 이동합니다.</div>
<script>
var DATA = null, MAX = 200;
var PDF_BASE = "https://woooty69.github.io/report-pdf/pdf/";
var TG_BASE = "https://t.me/c/1378197756/";
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
function fdate(d) { return d.length === 8 ? d.slice(0,4) + "-" + d.slice(4,6) + "-" + d.slice(6,8) : d; }
function render() {
  var q = document.getElementById("q").value.trim().toLowerCase();
  var list = document.getElementById("list"), stat = document.getElementById("stat"), hint = document.getElementById("hint");
  if (!DATA) { stat.textContent = "목록을 불러오는 중..."; return; }
  if (!q) { list.innerHTML = ""; stat.textContent = "전체 " + DATA.count + "건 · 기준 " + DATA.generated; hint.style.display = ""; return; }
  hint.style.display = "none";
  var out = [], n = 0;
  for (var i = 0; i < DATA.items.length; i++) {
    var it = DATA.items[i];
    if (it[0].toLowerCase().indexOf(q) < 0 && it[1].indexOf(q) < 0) continue;
    n++;
    if (out.length >= MAX) continue;
    var web = it[5], url;
    if (web && web.indexOf && web.indexOf("|") > 0) {
      var p = web.split("|");
      url = "https://woooty69.github.io/hw-pdf-arch-" + p[0] + "/" + encodeURIComponent(p[1]);
    } else if (web) {
      url = PDF_BASE + encodeURIComponent(web);
    } else {
      url = it[4] ? TG_BASE + it[4] : "#";
    }
    var tag = web ? '<span class="tag web">PDF</span>' : '<span class="tag tg">텔레그램</span>';
    out.push('<a class="row" href="' + url + '" target="_blank" rel="noopener"><span class="d">' + fdate(it[2]) +
      '</span><span class="c">' + esc(it[0]) + (it[1] ? ' <small>[' + it[1] + ']</small>' : '') +
      '</span><span class="b">' + esc(it[3]) + '</span>' + tag + '</a>');
  }
  stat.textContent = n + "건 검색됨" + (n > MAX ? " (최신 " + MAX + "건 표시)" : "");
  list.innerHTML = out.join("");
}
document.getElementById("q").addEventListener("input", render);
fetch("./pdfindex.json").then(function (r) { return r.json(); }).then(function (j) {
  DATA = j; render();
}).catch(function () { document.getElementById("stat").textContent = "목록을 불러오지 못했습니다. 새로고침해 주세요."; });
</script>
</body>
</html>
